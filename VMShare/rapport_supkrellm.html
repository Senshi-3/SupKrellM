
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rapport système - supkrellm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="https://friconix.com/png/fi-cnsuxx-linux.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
    <style>
        :root{
            --ok: #1f9d55;
            --warn: #c07f00;
            --err: #d64545;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }

        html, body{
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: rgb(11, 16, 32);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif;
            scroll-behavior: smooth;
            overflow-y: hidden;
        }

        a{
            text-decoration: none;
        }

        a:hover{
            transform: scale(1.1);
        }

        header{
            position: sticky;
            top: 0;
            padding-bottom: 1vw;
            display: flex;
            background: linear-gradient(180deg, rgba(11, 16, 32, 0.95), rgba(11, 16, 32, 0.7));
            backdrop-filter: blur(5px);
            z-index: 3;
            border-bottom: 1px solid rgb(33, 50, 107);
            text-align: center;
            align-items: center;
            flex-direction: column;
            animation: page-allumage 1s forwards;
            overflow: hidden;
        }

        #texte-titre{
            font-family: "Audiowide", sans-serif;
            color: white;
        }

        #navigateur{
            display: flex;
            gap: 2vw;
            align-items: flex-start;
        }

        .texte-navigateur{
            font-family: "Audiowide", sans-serif;
            color: #4ca3cb;
            position: relative;
            animation: entrer-nav-text 1.5s forwards;
            opacity: 0;
        }

        .texte-navigateur:nth-child(1) {animation-delay: 0s;}
        .texte-navigateur:nth-child(2) {animation-delay: 0.4s;}
        .texte-navigateur:nth-child(3) {animation-delay: 0.8s;}
        .texte-navigateur:nth-child(4) {animation-delay: 1.2s; }
        .texte-navigateur:nth-child(5) {animation-delay: 1.6s;}
        .texte-navigateur:nth-child(6) {animation-delay: 2s}
        .texte-navigateur:nth-child(7) {animation-delay: 2.4s;}
        .texte-navigateur:nth-child(8) {animation-delay: 2.8s; color: var(--err);}

        main{
            max-width: 100vw;
            margin: 0 auto;
            padding: 0;
        }

        h2{
            display: inline-block;
            color: #287da1;
        }

        .section{
            scroll-margin-top: 7vw;
        }

        section:target{
            animation: mis-en-evidence 0.3s ease-out;
        }

        section:target .grille3,
        section:target .grille2,
        section:target .bloc-table{
            animation: bordure-evidence 1s linear;
        }

        section:target .bloc-erreurs{
            animation: bordure-evidence-err 1s linear;
        }

        .bloc{
            background-color: rgba(24, 35, 58, 0.733);
            padding: 1vw;
            border-radius: 1em;
            border: 1px solid #5e7d8aab;
            display: flex;
            flex-direction: column;
        }

        .bloc-table{
            background-color: rgba(24, 35, 58, 0);
            padding-bottom: 1vw;
            border-radius: 1em;
            border: 1px solid #5e7d8aab;
            display: flex;
            flex-direction: column;
        }

        .bloc-erreurs{
            border-left: 3px solid var(--err);
            padding: 1vw;
            border-radius: 1em;
            background: rgba(214, 69, 69, .08);
            margin-bottom: 1vw;
        }

        .bloc:hover{
            box-shadow: 0 0 3px 3px #2c627a;
        }

        .bloc-erreurs:hover{
            box-shadow: 0 0 3px 3px #7a2c2c;
        }

        .etiquette{
            color: #91c2d89a;
            font-family: var(--mono);
            padding-bottom: 1vw;
            user-select: none;
        }

        .valeur{
            color: #c9d1ff;
            font-family: var(--mono);
        }

        .grille3{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            border-radius: 1em;
        }

        .grille2{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            border-radius: 1em;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            padding: 1vw;
            border-bottom: 1px solid #1c2347;
            text-align: left;
            color: #c9d1ff;
        }

        th{
            color: #c9d1ff;
        }

        li{
            color: #c9d1ff;
        }

        ul, ol{
            margin-left: 1vw;
            padding-left: 1.2rem;
        }

        #texte-erreurs{
            color: #a12828;
        }

        footer{
            color: #a8b0d9;
            position: sticky;
            bottom: 0;
            font-size: 0.8vw;
            text-align: center;
            margin: 1vw;
            padding: 1vw;
            z-index: 10;
        }
        hr{
            box-shadow: 0 0 20px 50px rgb(11, 16, 32);
            color: transparent;
            position: sticky;
            bottom: 0;
            z-index: 9;
        }

        .badge{
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3em;
            font-size: 0.6vw;
            text-align: center;
            border: 1px solid #2a366b;
            background: #0e1430;
            color: #a8b0d9;
        }

        .ok {
            color: #d6ffe6;
            border-color: rgba(31,157,85,.45);
            background: rgba(31,157,85,.08);
        }

        .warn {
            color: #fff4d6;
            border-color: rgba(192,127,0,.45);
            background: rgba(192,127,0,.08);
        }

        .err {
            color: #ffe1e1;
            border-color: rgba(214,69,69,.45);
            background: rgba(214,69,69,.08);
        }

        iframe{
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        iframe::-webkit-scrollbar{
            display: none;
        }

        #bouton-rafraichir{
            margin-left: 1vw;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            border: 1px solid #2a366b;
            background: #0e1430;
            color: #a8b0d9;
            font-family: inherit;
            font-size: 0.8vw;
            outline: 0px solid white;
            outline-offset: 0.6vw;
            transition: all 0.05s ease-in-out;
            display: inline-flex;
            align-items: center;
            gap: 0.4vw;
            vertical-align: middle;
        }

        #bouton-rafraichir:hover{
            background: none;
            border: 0px solid #2a366b;
            outline: 2px solid white;
            outline-offset: 0.3vw;
            transition: all 0.05s ease-in-out; 
        }
        #bouton-rafraichir:active{
            background: none;
            border: 0px solid #2a366b;
            outline: 2px solid white;
            outline-offset: 0.3vw;
            transition: all 0.01s ease-in-out; 
        }
        #bouton-rafraichir:hover #logo-rafraichir{
            animation: rotation-logo-rafraichir 1s forwards;
        }

        @keyframes rotation-logo-rafraichir{
            0%{
                transform: rotate(0deg);
            }
            100%{ 
                transform: rotate(359deg); 
            }
        }

        @keyframes mis-en-evidence{
            0%{
                transform: scale(1);
            }
            40%{ 
                transform: scale(1.1); 
            }
            100%{ 
                transform: scale(1); 
            }
        }

        @keyframes bordure-evidence{
            0%{ 
                outline: 2px solid #5e7d8aab;
                outline-offset: 0.3vw; 
            }
            90%{ 
                outline: 1px solid #5e7d8aab; 
                outline-offset: 0.3vw; 
            }
            100%{ 
                outline: 0; 
                outline-offset: 0; 
            }
        }

        @keyframes bordure-evidence-err{
            0%{ 
                outline: 2px solid var(--err); 
                outline-offset: 0.3vw; 
            }
            90%{ 
                outline: 1px solid var(--err); 
                outline-offset: 0.3vw; 
            }
            100%{ 
                outline: 0; 
                outline-offset: 0; 
            }
        }

        @keyframes entrer-nav-text{
            0%{ 
                top: 100px; 
                opacity: 0; 
            }
            100%{ 
                top: 0; 
                opacity: 1; 
            }
        }
        

        @media (max-width: 767px){
            #texte-titre{ 
                font-size: 4vw;
            }
            #navigateur{ 
                gap: 1vw; 
            }
            .texte-navigateur, th, td, li, footer{ 
                font-size: 2vw; 
            }
            main{ 
                max-width: 95vw; 
            }
            h2{
                font-size: 3vw; 
            }
            .section{ 
                scroll-margin-top: 10vw;
            }
            .bloc, .bloc-table, .bloc-erreurs, .grille3, .grille2{ 
                border-radius: 0.5em;
            }
            .etiquette, .badge{
                font-size: 1.7vw;
            }
            .valeur{
                font-size: 2.3vw;
            }
            .grille3, .grille2{
                gap: 7px;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px){
            #texte-titre{ 
                font-size: 3vw; 
            }
            #navigateur{
                gap: 2vw; 
            }
            .texte-navigateur, th, td, li, footer{
                font-size: 1.5vw; 
            }
            main{
                max-width: 90vw;
            }
            h2{
                font-size: 2.7vw;
            }
            .section{
                scroll-margin-top: 9vw;
            }
            .bloc, .bloc-table, .bloc-erreurs, .grille3, .grille2 {
                border-radius: 0.5em;
            }
            .etiquette, .badge{
                font-size: 1.3vw;
            }
            .valeur{ 
                font-size: 1.8vw;
            }
            .grille3, .grille2{
                gap: 10px;
            }
        }
    </style>
</head>
